openapi: 3.0.3
info:
  title: Bench
  version: "1.1.0"
paths:
  /invoices:
    get:
      summary: List invoices
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
  /orders:
    get:
      summary: List orders
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /ping:
    get:
      summary: Ping
      responses:
        "200":
          description: ok
components:
  schemas:
    Money:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
        currency:
          type: string
    Order:
      type: object
      required: [id]
      properties:
        id:
          type: string
        total:
          $ref: "#/components/schemas/Money"
    Invoice:
      type: object
      required: [id]
      properties:
        id:
          type: string
        order:
          $ref: "#/components/schemas/Order"
