openapi: 3.0.3
info:
  title: Bench
  version: "1.1.0"
paths:
  /widgets:
    get:
      summary: List widgets
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
components:
  schemas:
    Item:
      type: object
      required: [id]
      properties:
        id:
          type: string
    Widget:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
