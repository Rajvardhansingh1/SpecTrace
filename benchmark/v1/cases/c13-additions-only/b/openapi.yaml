openapi: 3.0.3
info:
  title: Bench
  version: "1.1.0"
paths:
  /ping:
    get:
      summary: Ping
      responses:
        "200":
          description: ok
  /v2/ping:
    get:
      summary: Ping v2
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
components:
  schemas:
    Status:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Pong:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        at:
          type: string
